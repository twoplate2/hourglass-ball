name: Basic Checks

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install basic check dependencies
        run: |
          python -m pip install numpy pillow pyflakes kivy==2.3.0
      - name: Check layout, version, syntax and documentation
        run: python src/tools/run_regression.py --profile core
      - name: Check reviewed material source, evidence and foreground power policy
        run: |
          python -B src/tools/test_material_release.py
          python -B src/tools/check_motion_shape_release.py
          python -B src/tools/test_stream_motion_shape.py
          python -B src/tools/test_motion_shape_release.py
          python -B src/tools/test_short_grain.py
          python -B src/tools/test_short_grain_release.py
          python -B src/tools/test_grain_style.py
          python -B src/tools/test_ui_polish.py
          python -B src/tools/test_keep_awake.py
      - name: Install hidden PC graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Check real app power lifecycle in hidden PC window
        run: xvfb-run -a python -B src/tools/verify_keep_awake_runtime.py
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-regression-results
          path: |
            _temp/regression-runs/
            _temp/regression/
            _temp/pymunk-3.1/
          if-no-files-found: error
          retention-days: 30
