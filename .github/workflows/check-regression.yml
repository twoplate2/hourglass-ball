name: Basic Checks

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install basic check dependencies
        run: |
          python -m pip install numpy pillow pyflakes
      - name: Check layout, version, syntax and documentation
        run: python src/tools/run_regression.py --profile core
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-regression-results
          path: |
            _temp/regression-runs/
            _temp/regression/
          if-no-files-found: error
          retention-days: 30
