name: Build native lib

# 只编 flowcore 的 arm64 .so 并提交回分支 —— 用于在设备上实测 C 加速,
# 绕开 APK/recipe 那条路。
on:
  push:
    branches: [ native-flowcore ]
  workflow_dispatch:

jobs:
  lib:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 环境自检
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -5 || echo "(无 $ANDROID_HOME/ndk)"
          ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -5 || echo "(无 /usr/local/lib/android/sdk/ndk)"

      - name: 取 CPython 3.11.5 头文件 + pyconfig.h
        run: |
          curl -sLO https://www.python.org/ftp/python/3.11.5/Python-3.11.5.tgz && tar xf Python-3.11.5.tgz
          ls Python-3.11.5/Include | head -2
          HOST_INC=$(python3 -c "import sysconfig;print(sysconfig.get_paths()['include'])" 2>&1)
          echo "HOST_INC=$HOST_INC"
          SRC=""
          if [ -f "$HOST_INC/pyconfig.h" ]; then SRC="$HOST_INC/pyconfig.h"; fi
          if [ -z "$SRC" ]; then SRC=$(find / -name pyconfig.h -not -path "*/Python-3.11.5/*" 2>/dev/null | head -1); fi
          echo "找到 pyconfig.h: $SRC"
          if [ -n "$SRC" ]; then
            cp "$SRC" Python-3.11.5/Include/pyconfig.h
            ls -l Python-3.11.5/Include/pyconfig.h
          else
            find / -name "pyconfig.h*" 2>/dev/null | head -8
            echo "::error title=pyconfig-missing::HOST_INC=$HOST_INC"
          fi

      - name: 交叉编译 arm64 .so
        run: |
          set -o pipefail
          NDK_DIR=$(ls -d ${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/*} 2>/dev/null | sort -V | tail -1)
          echo "NDK_DIR=$NDK_DIR"
          CLANG=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          ls -l $CLANG
          $CLANG --target=aarch64-linux-android21 -shared -fPIC -O2 \
            -I Python-3.11.5/Include \
            -o flowcore.cpython-311-aarch64-linux-android.so \
            p4a-recipes/flowcore/src/flowcore.c 2>&1 | tee cc.log
          file flowcore.cpython-311-aarch64-linux-android.so
          ls -l flowcore.cpython-311-aarch64-linux-android.so

      - name: 失败时把编译报错发成 annotation
        if: failure()
        run: |
          grep -i -E "error|no such|not found|cannot|undefined" cc.log 2>/dev/null | tail -8 | sed 's/%/%25/g' | paste -sd'|' - > e.txt || true
          echo "::error title=cc-errors::$(cat e.txt)"

      - name: 提交回分支
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          mkdir -p prebuilt
          mv flowcore.cpython-311-aarch64-linux-android.so prebuilt/
          git add -f prebuilt/
          git commit -m "CI: 提交 arm64 flowcore.so(供设备实测)" || echo "无变化"
          git push
