name: Build APK

on:
  push:
    branches: [main, master, trial/b14-3.36]
  workflow_dispatch:

permissions:
  contents: write        # 建 Release 要它 —— 见最后那步"Publish APK to Release"

jobs:
  regression:
    uses: ./.github/workflows/check-regression.yml
  build:
    needs: regression
    runs-on: ubuntu-22.04          # 不要用 24.04, buildozer 还没适配
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # host Python(给 buildozer 用),与嵌入 APK 的 target Python 是两回事

      - name: 检查版本递增与中文提交标题
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          fi
          python src/tools/check_release_version.py --base "$BASE_SHA" --head "$HEAD_SHA" --check-title

      - name: 核对试用分支与 APK 版本
        if: github.ref == 'refs/heads/trial/b14-3.36'
        run: |
          version=$(python -c 'from src.app.app_version import APP_VERSION; print(APP_VERSION)')
          [[ "$GITHUB_REF_NAME" == "trial/b14-$version" ]]
          echo "TRIAL_VERSION=$version" >> "$GITHUB_ENV"

      - name: 验证 APK 版本来源一致
        run: python src/tools/test_release_version.py

      - name: 静态检查未定义名字 (pyflakes)
        # 只挡 "undefined name" —— 那是**启动即死**级别的错误, 而 ast.parse 只查语法、
        # 抓不到它。2026-10-03 事故: 改这段注释时删掉了 `from kivy.config import Config`,
        # 1.40~1.46 **七个版本在 Android 上全部启动即死**(NameError), 而桌面复现不出来
        # —— 那行只在 Android 分支执行。pyflakes 一秒就能抓到, 所以放进闸门。
        # (其余告警如"未使用的变量/import"不挡, 只报告。)
        run: |
          pip install pyflakes
          python -m pyflakes main.py src/app/*.py src/tools/android_hook.py src/build/recipes/*/*.py > /tmp/pf.txt 2>&1 || true
          if grep -q "undefined name" /tmp/pf.txt; then
            grep "undefined name" /tmp/pf.txt
            echo "::error::存在未定义名字 —— Android 上会启动即死"
            exit 1
          fi
          echo "无未定义名字 ✓"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake

      - name: Install buildozer & Cython (锁定到 2024 兼容版本)
        run: |
          python -m pip install --upgrade pip wheel
          pip install "cython<3.0" "buildozer==1.5.0"

      - name: Cache Buildozer global cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'src/build/recipes/**') }}

      - name: 准备并检查试用包实际使用的 B14 配置
        if: github.ref == 'refs/heads/trial/b14-3.36'
        run: |
          test ! -e src/app/b14_trial_build.py
          printf '%s\n' 'B14_TRIAL = True' > src/app/b14_trial_build.py
          python -m pip install numpy pillow
          python -B src/tools/check_b14_trial_build.py

      - name: Build APK (debug)
        run: |
          # ⚠️ **不要加 `set -o pipefail`**: `yes` 会以 141(SIGPIPE) 收尾, pipefail 会把
          #    **构建成功**也判成失败。改用 PIPESTATUS 取 buildozer 自己的返回码。
          yes | buildozer android debug 2>&1 | tee build.log
          rc=${PIPESTATUS[1]}
          echo "buildozer exit=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          unzip -t bin/*.apk lib/arm64-v8a/libb13raster.so
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: 核对实际打进 APK 的沙流配置
        run: |
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          (apk,) = Path("bin").glob("*.apk")
          trial = bool(os.environ.get("TRIAL_VERSION"))
          with zipfile.ZipFile(apk) as package, package.open("assets/private.tar") as payload:
              with tarfile.open(fileobj=payload, mode="r|*") as files:
                  markers = [m.name for m in files if m.isfile() and
                             PurePosixPath(m.name) in (PurePosixPath("src/app/b14_trial_build.pyc"),
                                                       PurePosixPath("src/app/b14_trial_build.py"))]
          if bool(markers) != trial:
              raise SystemExit(f"APK B14 build markers: {markers!r}, expected trial={trial}")
          print(f"{apk.name}: trial={trial}, markers={markers!r}")
          PY

      # 🔴 **2026-10-11: 构建日志必须"我自己读得到"。**
      #    run 378(2.59) 构建失败, 而 Actions 的日志**要登录才能看**, api.github.com
      #    在本机 IP 又是 403 ⇒ 我盯着一个**读不到的失败**空等了 30 分钟, 只能空猜。
      #    这条把 `build.log` 发到 Release(`ci-log` tag, 资产**公开可下**) ⇒ 失败也能自诊。
      #    成功也发(体积小, 且方便回溯"某次构建到底跑了什么")。
      #    ⚠️ 用**独立 tag**, 不能混进 `latest` —— 那是给用户下 APK 的, 别塞日志。
      - name: Publish build log
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -f build.log ] || { echo "no build.log"; exit 0; }
          gh release view ci-log >/dev/null 2>&1 || gh release create ci-log --title "CI build log" --notes "最近一次构建的完整日志(滚动覆盖, 供诊断)"
          gh release view ci-log --json assets -q '.assets[].name' 2>/dev/null | while read -r old; do [ -n "$old" ] && gh release delete-asset ci-log "$old" --yes || true; done
          gh release upload ci-log build.log --clobber
          gh release edit ci-log --notes "commit ${GITHUB_SHA:0:12} · $(date -u +%FT%TZ)"

      - name: Show output
        run: ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hourglass-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90

      # 🔴 **2026-10-11: 把 APK 发到 Release —— 这是"闭环"的关键一步。**
      #    `actions/upload-artifact` 的产物**必须登录才能下**(GitHub 的硬规矩),
      #    所以「让 Claude 自己下包 → 装包 → 测包」那条闭环一直断在这里。
      #    **Release 的资产是公开可下的** ⇒ 之后 `curl -L` 就能拿到, 不需要任何 token。
      #    每次 push 覆盖同一个 `latest` tag(滚动发布), 只保留最新一版。
      - name: Publish APK to Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls bin/*.apk | head -1)
          echo "publishing $APK"
          gh release view latest >/dev/null 2>&1 ||             gh release create latest --title "hourglass latest"                --notes "滚动发布: 每次 push 覆盖(资产=最新一次构建的 debug APK)"
          # ⚠️ `--clobber` 只覆盖**同名**文件 ⇒ 换版本号时旧 APK 会一直累积
          #    (实测 latest 里同时躺着 2.54 与 2.55) ⇒ 上传前先把旧资产清掉。
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null |             while read -r old; do [ -n "$old" ] && gh release delete-asset latest "$old" --yes || true; done
          gh release upload latest "$APK" --clobber
          gh release edit latest --notes "commit ${GITHUB_SHA:0:12} · $(basename "$APK") · $(date -u +%FT%TZ)"

      - name: 发布 B14 试用 APK
        if: github.ref == 'refs/heads/trial/b14-3.36'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="trial-$TRIAL_VERSION"
          apks=(bin/*.apk)
          [[ ${#apks[@]} == 1 && -f "${apks[0]}" ]]
          # A release retry may encounter a tag left by an earlier interrupted run.
          git push origin "$GITHUB_SHA:refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            [[ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" == true ]]
            gh release upload "$tag" "${apks[0]}" --clobber
          else
            gh release create "$tag" "${apks[0]}" --target "$GITHUB_SHA" --verify-tag --prerelease --latest=false \
              --title "沙漏 $TRIAL_VERSION · B14 首落试用版" \
              --notes "原速 PC 画面按轮廓估算，首落时 20 秒档缺少满杯的 6.52 个百分点，50 秒档缺少 2.37 个百分点。本次运行验证在 PC 上完成。提交 ${GITHUB_SHA:0:12}。"
          fi
