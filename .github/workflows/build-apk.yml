name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write        # 建 Release 要它 —— 见最后那步"Publish APK to Release"

jobs:
  regression:
    uses: ./.github/workflows/check-regression.yml
  build:
    needs: regression
    runs-on: ubuntu-22.04          # 不要用 24.04, buildozer 还没适配
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # host Python(给 buildozer 用),与嵌入 APK 的 target Python 是两回事

      - name: 检查版本递增与中文提交标题
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          fi
          python src/tools/check_release_version.py --base "$BASE_SHA" --head "$HEAD_SHA" --check-title

      - name: 验证 APK 版本来源一致
        run: python src/tools/test_release_version.py

      - name: 静态检查未定义名字 (pyflakes)
        # 只挡 "undefined name" —— 那是**启动即死**级别的错误, 而 ast.parse 只查语法、
        # 抓不到它。2026-10-03 事故: 改这段注释时删掉了 `from kivy.config import Config`,
        # 1.40~1.46 **七个版本在 Android 上全部启动即死**(NameError), 而桌面复现不出来
        # —— 那行只在 Android 分支执行。pyflakes 一秒就能抓到, 所以放进闸门。
        # (其余告警如"未使用的变量/import"不挡, 只报告。)
        run: |
          pip install pyflakes
          python -m pyflakes main.py src/app/*.py src/tools/android_hook.py src/build/recipes/*/*.py > /tmp/pf.txt 2>&1 || true
          if grep -q "undefined name" /tmp/pf.txt; then
            grep "undefined name" /tmp/pf.txt
            echo "::error::存在未定义名字 —— Android 上会启动即死"
            exit 1
          fi
          echo "无未定义名字 ✓"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake

      - name: Install buildozer & Cython (锁定到 2024 兼容版本)
        run: |
          python -m pip install --upgrade pip wheel
          pip install "cython<3.0" "buildozer==1.5.0"

      - name: Cache Buildozer global cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'src/build/recipes/**') }}

      - name: Build APK (debug)
        run: |
          # ⚠️ **不要加 `set -o pipefail`**: `yes` 会以 141(SIGPIPE) 收尾, pipefail 会把
          #    **构建成功**也判成失败。改用 PIPESTATUS 取 buildozer 自己的返回码。
          yes | buildozer android debug 2>&1 | tee build.log
          rc=${PIPESTATUS[1]}
          echo "buildozer exit=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          unzip -t bin/*.apk lib/arm64-v8a/libb13raster.so
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      # 🔴 **2026-10-11: 构建日志必须"我自己读得到"。**
      #    run 378(2.59) 构建失败, 而 Actions 的日志**要登录才能看**, api.github.com
      #    在本机 IP 又是 403 ⇒ 我盯着一个**读不到的失败**空等了 30 分钟, 只能空猜。
      #    这条把 `build.log` 发到 Release(`ci-log` tag, 资产**公开可下**) ⇒ 失败也能自诊。
      #    成功也发(体积小, 且方便回溯"某次构建到底跑了什么")。
      #    ⚠️ 构建日志使用独立标签，GitHub 最新发布入口留给 APK。
      - name: Publish build log
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -f build.log ] || { echo "no build.log"; exit 0; }
          gh release view ci-log >/dev/null 2>&1 || gh release create ci-log --latest=false --title "CI build log" --notes "最近一次构建的完整日志(滚动覆盖, 供诊断)"
          gh release view ci-log --json assets -q '.assets[].name' 2>/dev/null | while read -r old; do [ -n "$old" ] && gh release delete-asset ci-log "$old" --yes || true; done
          gh release upload ci-log build.log --clobber
          gh release edit ci-log --notes "commit ${GITHUB_SHA:0:12} · $(date -u +%FT%TZ)"

      - name: Show output
        run: ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hourglass-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布数字版本 APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          version=$(python -c 'from src.app.app_version import APP_VERSION; print(APP_VERSION)')
          [[ "$version" =~ ^[0-9]+[.][0-9]+$ ]]
          apks=(bin/*.apk)
          [[ ${#apks[@]} == 1 && -f "${apks[0]}" ]]
          name=$(basename "${apks[0]}")
          [[ "$name" == "hourglass-$version-arm64-v8a-debug.apk" ]]

          # 非强制创建标签。已有标签指向其他提交时，Git 会拒绝本次发布。
          git push origin "$GITHUB_SHA:refs/tags/$version"
          latest=true
          newest=$({ printf '%s\n' "$version"; gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'; } |
                   sed -nE '/^[0-9]+[.][0-9]+$/p' | sort -V | tail -n 1)
          if [[ "$newest" != "$version" ]]; then latest=false; fi

          if gh release view "$version" >/dev/null 2>&1; then
            assets=$(gh release view "$version" --json assets --jq '.assets[].name')
            if ! grep -Fxq "$name" <<< "$assets"; then
              gh release upload "$version" "${apks[0]}"
            fi
            gh release edit "$version" --title "$version" --draft=false --prerelease=false --latest="$latest"
          else
            gh release create "$version" "${apks[0]}" --verify-tag --title "$version" --latest="$latest" \
              --notes "提交 ${GITHUB_SHA:0:12}。"
          fi
