name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # 建 Release 要它 —— 见最后那步"Publish APK to Release"

jobs:
  build:
    runs-on: ubuntu-22.04          # 不要用 24.04, buildozer 还没适配
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # host Python(给 buildozer 用),与嵌入 APK 的 target Python 是两回事

      - name: 检查版本递增与中文提交标题
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python tools/check_release_version.py --base "$BASE_SHA" --head "$HEAD_SHA" --check-title

      - name: 验证 APK 版本来源一致
        run: python tools/test_release_version.py

      - name: 静态检查未定义名字 (pyflakes)
        # 只挡 "undefined name" —— 那是**启动即死**级别的错误, 而 ast.parse 只查语法、
        # 抓不到它。2026-10-03 事故: 改这段注释时删掉了 `from kivy.config import Config`,
        # 1.40~1.46 **七个版本在 Android 上全部启动即死**(NameError), 而桌面复现不出来
        # —— 那行只在 Android 分支执行。pyflakes 一秒就能抓到, 所以放进闸门。
        # (其余告警如"未使用的变量/import"不挡, 只报告。)
        run: |
          pip install pyflakes
          python -m pyflakes main.py frame_benchmark.py app_version.py tools/*.py > /tmp/pf.txt 2>&1 || true
          if grep -q "undefined name" /tmp/pf.txt; then
            grep "undefined name" /tmp/pf.txt
            echo "::error::存在未定义名字 —— Android 上会启动即死"
            exit 1
          fi
          echo "无未定义名字 ✓"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake

      - name: Install buildozer & Cython (锁定到 2024 兼容版本)
        run: |
          python -m pip install --upgrade pip wheel
          pip install "cython<3.0" "buildozer==1.5.0"

      - name: Cache Buildozer global cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v1-${{ runner.os }}-

      - name: Build APK (debug)
        run: |
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Show output
        run: ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hourglass-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90

      # 🔴 **2026-10-11: 把 APK 发到 Release —— 这是"闭环"的关键一步。**
      #    `actions/upload-artifact` 的产物**必须登录才能下**(GitHub 的硬规矩),
      #    所以「让 Claude 自己下包 → 装包 → 测包」那条闭环一直断在这里。
      #    **Release 的资产是公开可下的** ⇒ 之后 `curl -L` 就能拿到, 不需要任何 token。
      #    每次 push 覆盖同一个 `latest` tag(滚动发布), 只保留最新一版。
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls bin/*.apk | head -1)
          echo "publishing $APK"
          gh release view latest >/dev/null 2>&1 ||             gh release create latest --title "hourglass latest"                --notes "滚动发布: 每次 push 覆盖(资产=最新一次构建的 debug APK)"
          # ⚠️ `--clobber` 只覆盖**同名**文件 ⇒ 换版本号时旧 APK 会一直累积
          #    (实测 latest 里同时躺着 2.54 与 2.55) ⇒ 上传前先把旧资产清掉。
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null |             while read -r old; do [ -n "$old" ] && gh release delete-asset latest "$old" --yes || true; done
          gh release upload latest "$APK" --clobber
          gh release edit latest --notes "commit ${GITHUB_SHA:0:12} · $(basename "$APK") · $(date -u +%FT%TZ)"
