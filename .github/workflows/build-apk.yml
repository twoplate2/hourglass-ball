name: Build APK

on:
  push:
    branches: [ main, master, native-flowcore ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04          # 不要用 24.04, buildozer 还没适配
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # host Python(给 buildozer 用),与嵌入 APK 的 target Python 是两回事

      - name: 检查版本递增与中文提交标题
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python tools/check_release_version.py --base "$BASE_SHA" --head "$HEAD_SHA" --check-title

      - name: 验证 APK 版本来源一致
        run: python tools/test_release_version.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake

      - name: Install buildozer & Cython (锁定到 2024 兼容版本)
        run: |
          python -m pip install --upgrade pip wheel
          pip install "cython<3.0" "buildozer==1.5.0"

      - name: Cache Buildozer global cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('p4a-recipes/**', 'buildozer.spec') }}
          restore-keys: |
            buildozer-v1-${{ runner.os }}-

      - name: 本地 recipe 用绝对路径(buildozer 会切 CWD, 相对路径会静默失效)
        run: |
          sed -i "s|^p4a.local_recipes = .*$|p4a.local_recipes = $PWD/p4a-recipes|" buildozer.spec
          grep -n "^p4a.local_recipes" buildozer.spec
          ls -l p4a-recipes/flowcore/__init__.py p4a-recipes/flowcore/src/

      - name: Build APK (debug)
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee buildozer.log
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: 失败时把日志里的报错行发成 annotation
        if: failure()
        run: |
          grep -n -i -E "error|traceback|exception|not exist|no such|ValueError|recipe" buildozer.log 2>/dev/null | tail -14 | sed 's/%/%25/g' | paste -sd'|' - > errs.txt || true
          echo "::error title=buildozer-errors::$(cat errs.txt)"

      - name: Show output
        run: ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hourglass-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90
