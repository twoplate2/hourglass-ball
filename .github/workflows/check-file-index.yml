name: Check File Index

on:
  # Push/PR checks already run through Build APK / Basic Checks.
  schedule:
    # GitHub cron uses UTC: 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 安装基础检查依赖
        run: python -m pip install pillow pyflakes
      - name: 检查文件索引、设计页图片和基础规则
        run: python src/tools/run_regression.py --profile core
      - name: 保留检查报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: file-index-results
          path: _temp/regression-runs/
          if-no-files-found: error
